name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Sirf main branch push hone par deploy hoga

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install
      - name: 📥 Install Dependencies
        run: npm ci

      # Step 4: Build check
      - name: 🔨 Build Project
        run: npm run build

      # Step 5: SSH karke VPS pe deploy karo
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            echo "=== Starting Clean Deploy ==="
            cd /var/www/outsetStudio
            
            # 1. Fetch & reset git
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Set production env
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3004" > .env.production
            
            # 3. Stop old server process & free port 3004 completely
            echo "Stopping old PM2 process and freeing port 3004..."
            pm2 delete outset-studio || true
            fuser -k 3004/tcp || true
            pkill -f "next-server" || true
            sleep 2
            
            # 4. Install dependencies
            echo "Installing dependencies..."
            npm ci --production=false
            
            # 5. Clean build
            echo "Cleaning old build artifacts..."
            rm -rf .next
            
            echo "Building Next.js project..."
            npm run build
            
            # 6. Fix file permissions
            echo "Setting directory permissions..."
            chmod -R 755 /var/www/outsetStudio
            
            # 7. Start fresh PM2 process
            echo "Starting fresh Next.js instance on port 3004..."
            pm2 start npm --name "outset-studio" -- start -- -p 3004
            
            pm2 save || true
            sleep 3
            pm2 status
            
            echo "=== Deploy Complete! ==="

