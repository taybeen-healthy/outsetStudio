name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Sirf main branch push hone par deploy hoga

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install
      - name: 📥 Install Dependencies
        run: npm ci

      # Step 4: Build check
      - name: 🔨 Build Project
        run: npm run build

      # Step 5: SSH karke VPS pe deploy karo
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$PATH
            
            echo "=== Starting Deploy ==="
            cd /var/www/outsetStudio
            
            echo "1. Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "2. Setting production env..."
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3004" > .env.production
            echo "PORT=3004" >> .env.production
            
            echo "3. Installing dependencies..."
            npm ci --production=false
            
            echo "4. Cleaning & building Next.js project..."
            rm -rf .next
            npm run build
            
            echo "5. Setting file permissions..."
            chmod -R 755 /var/www/outsetStudio
            
            echo "6. Stopping old PM2 processes completely..."
            pm2 delete all 2>/dev/null || true
            sleep 2
            
            echo "7. Starting Next.js on port 3004 via PM2..."
            pm2 start node_modules/next/dist/bin/next --name "outset-studio" -- start -p 3004
            pm2 save 2>/dev/null || true
            sleep 3
            pm2 status
            
            echo "=== Deploy Complete! ==="
