name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Sirf main branch push hone par deploy hoga

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install
      - name: 📥 Install Dependencies
        run: npm ci

      # Step 4: Build check
      - name: 🔨 Build Project
        run: npm run build

      # Step 5: SSH karke VPS pe deploy karo
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            
            echo "=== Starting Deploy ==="
            cd /var/www/outsetStudio
            
            # Check Node version
            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"
            
            # Pull latest code
            git pull origin main
            
            # Production env set karo (VPS port 3004)
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3004" > .env.production
            
            # Install dependencies
            npm ci --production=false
            
            # Backup old build in case new build fails
            if [ -d ".next" ]; then
              echo "Backing up old .next build..."
              rm -rf .next.bak
              mv .next .next.bak
            fi
            
            # Build
            echo "Building..."
            if npm run build; then
              echo "Build succeeded! Removing backup."
              rm -rf .next.bak
            else
              echo "BUILD FAILED! Restoring backup..."
              if [ -d ".next.bak" ]; then
                mv .next.bak .next
              fi
              exit 1
            fi
            
            # Restart PM2
            pm2 restart outset-studio || pm2 start npm --name "outset-studio" -- start -- -p 3004
            sleep 3
            pm2 status
            
            echo "=== Deploy Complete! ==="
