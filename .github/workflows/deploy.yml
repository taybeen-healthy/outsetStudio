name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Sirf main branch push hone par deploy hoga

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install
      - name: 📥 Install Dependencies
        run: npm ci

      # Step 4: Build check
      - name: 🔨 Build Project
        run: npm run build

      # Step 5: SSH karke VPS pe deploy karo
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$PATH
            
            echo "=== 1. Checking PM2 Backups & Previous Apps ==="
            ls -la ~/.pm2/dump.pm2* 2>/dev/null || true
            
            echo "=== 2. Previous Apps from PM2 Logs ==="
            ls -la ~/.pm2/logs/ 2>/dev/null || true
            
            echo "=== 3. Project Folders in /var/www ==="
            ls -la /var/www/ 2>/dev/null || true
            
            echo "=== 4. Attempting PM2 Resurrect from Backup ==="
            if [ -f "$HOME/.pm2/dump.pm2.bak" ]; then
              echo "Found dump.pm2.bak, restoring..."
              cp "$HOME/.pm2/dump.pm2.bak" "$HOME/.pm2/dump.pm2"
              pm2 resurrect || true
            fi
            
            echo "=== 5. Ensuring outset-studio is running on port 3004 ==="
            cd /var/www/outsetStudio
            git fetch origin main
            git reset --hard origin/main
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3004" > .env.production
            echo "PORT=3004" >> .env.production
            chmod -R 755 /var/www/outsetStudio
            
            pm2 delete outset-studio 2>/dev/null || true
            pm2 start node_modules/next/dist/bin/next --name "outset-studio" -- start -p 3004
            
            pm2 save || true
            sleep 2
            
            echo "=== 6. All Active PM2 Services ==="
            pm2 status
            
            echo "=== Restore & Deploy Finished ==="
