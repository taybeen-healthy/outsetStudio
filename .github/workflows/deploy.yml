name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Sirf main branch push hone par deploy hoga

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install
      - name: 📥 Install Dependencies
        run: npm ci

      # Step 4: Build check
      - name: 🔨 Build Project
        run: npm run build

      # Step 5: SSH karke VPS pe deploy karo
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            echo "=== Starting Deploy ==="
            cd /var/www/outsetStudio
            
            # Fetch & reset to main branch cleanly
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            # Set production env
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3004" > .env.production
            
            # Install dependencies
            echo "Installing dependencies..."
            npm ci --production=false
            
            # Build project
            echo "Building project..."
            npm run build
            
            # PM2 restart or start
            echo "Restarting PM2 process..."
            if pm2 describe outset-studio > /dev/null 2>&1; then
              pm2 restart outset-studio
            else
              pm2 start npm --name "outset-studio" -- start -- -p 3004
            fi
            
            pm2 save || true
            echo "=== Deploy Complete! ==="

