name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Sirf main branch push hone par deploy hoga

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Dependencies install
      - name: 📥 Install Dependencies
        run: npm ci

      # Step 4: Build check
      - name: 🔨 Build Project
        run: npm run build

      # Step 5: SSH karke VPS pe deploy karo
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$PATH
            
            echo "=== Starting Deploy ==="
            cd /var/www/outsetStudio
            
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3004" > .env.production
            
            echo "Installing dependencies..."
            npm ci --production=false
            
            echo "Cleaning & building Next.js project..."
            rm -rf .next
            npm run build
            
            echo "Setting permissions..."
            chmod -R 755 /var/www/outsetStudio
            
            echo "Restarting PM2 process freshly..."
            pm2 delete outset-studio 2>/dev/null || true
            pm2 start npm --name "outset-studio" -- start -- -p 3004
            pm2 save 2>/dev/null || true
            
            echo "=== Deploy Complete! ==="
